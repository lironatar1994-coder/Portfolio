<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>LA webs — share card</title>
<style>
@font-face{font-family:'Frank Ruhl Libre';src:url('../public/fonts/frank-ruhl-libre-hebrew.woff2') format('woff2');font-weight:300 900;unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Frank Ruhl Libre';src:url('../public/fonts/frank-ruhl-libre-latin.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:'Plex Hebrew';src:url('../public/fonts/plex-hebrew-500-hebrew.woff2') format('woff2');font-weight:500;unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Plex Hebrew';src:url('../public/fonts/plex-hebrew-500-latin.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Plex Hebrew';src:url('../public/fonts/plex-hebrew-600-hebrew.woff2') format('woff2');font-weight:600;unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Plex Hebrew';src:url('../public/fonts/plex-hebrew-600-latin.woff2') format('woff2');font-weight:600}

:root{--paper:#fbfaf7;--ink:#14130f;--muted:#66635a;--line:#e6e2d9;--accent:#d1341c;
  --display:'Frank Ruhl Libre',serif;--body:'Plex Hebrew',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--paper)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}

.card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--paper)}
/* faint paper grid, like a sketchbook page */
.card::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:60px 60px;background-position:-1px -1px;opacity:.4;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 100%)}

/* big vermilion block on the left carries the work */
.block{position:absolute;top:0;bottom:0;left:0;width:520px;background:var(--accent);
  border-radius:0 0 0 0}
.block::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 0% 100%,rgb(255 255 255/.14),transparent 55%),
  radial-gradient(70% 60% at 100% 0%,rgb(0 0 0/.16),transparent 60%)}
.mark{position:absolute;left:40px;top:40px;width:96px;height:96px;opacity:.95}

/* copy */
.copy{position:absolute;right:64px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;padding:54px 0 52px}
.brand{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;direction:ltr;text-align:left;display:flex;align-items:baseline;gap:.22em;align-self:flex-start}
.brand span{font-weight:500}
.brand i{display:inline-block;width:.24em;height:.24em;background:var(--accent);margin-left:.06em;transform:translateY(-.02em)}
.kicker{font-size:21px;font-weight:600;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:14px;margin:auto 0 18px}
.kicker::before{content:"";width:12px;height:12px;background:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:112px;line-height:.95;letter-spacing:-.02em}
h1 .period{color:var(--accent)}
.lede{margin:26px 0 auto;font-size:25px;line-height:1.45;color:#3c3a34;max-width:540px;font-weight:500}
.domain{display:flex;align-items:center;gap:18px;font-size:24px;font-weight:600;letter-spacing:.01em}
.domain .pill{direction:ltr;background:var(--ink);color:var(--paper);padding:12px 24px 14px;border-radius:999px;line-height:1}
.domain .wa{color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
.domain .wa svg{width:26px;height:26px}

/* the work: a hand of phone cards */
.hand{position:absolute;left:0;top:0;width:520px;height:630px}
.hand-card{position:absolute;left:50%;top:50%;width:236px;height:330px;border-radius:22px;overflow:hidden;
  box-shadow:0 30px 60px -22px rgb(0 0 0/.55),0 2px 0 rgb(255 255 255/.25) inset;
  transform:translate(-50%,-50%) rotate(var(--r)) translate(var(--x),var(--y));background:#222;border:6px solid var(--paper)}
.hand-card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.c1{--r:-15deg;--x:-112px;--y:30px;filter:brightness(.82)}
.c2{--r:15deg;--x:112px;--y:30px;filter:brightness(.82)}
.c3{--r:0deg;--x:0px;--y:-6px;width:250px;height:350px;z-index:2}
.hand-name{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 14px;color:#fff;font-size:17px;font-weight:600;
  background:linear-gradient(transparent,rgb(0 0 0/.72));text-align:center;letter-spacing:.01em}
</style>
</head>
<body>
<div class="card">
  <div class="block"><img class="mark" src="../public/la-monogram-white.svg" alt=""></div>
  <div class="hand">
    <div class="hand-card c1"><img src="../public/images/pinhas-card.webp" alt=""></div>
    <div class="hand-card c2"><img src="../public/images/libi-card.webp" alt=""></div>
    <div class="hand-card c3"><img src="../public/images/koral-card.webp" alt=""><span class="hand-name">קורל אירועים</span></div>
  </div>
  <div class="copy">
    <div class="brand">LA<span>webs</span><i></i></div>
    <p class="kicker">סטודיו לעיצוב ופיתוח אתרים</p>
    <h1>אתר תדמית<br>עם אופי<span class="period">.</span></h1>
    <p class="lede">נבנה לעסק שלך אתר שנכתב מאפס סביב מי שמאחוריו. כל העבודות כאן חיות באוויר.</p>
    <div class="domain"><span class="pill">lawebs.co.il</span><span class="wa"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 1.8a8.2 8.2 0 1 1-4.2 15.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8Zm-3 4.4c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 5 4.3 2.4 1 2.9.8 3.5.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.5-.3l-1.9-.9c-.3-.1-.5-.2-.7.1l-.9 1.1c-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5L9.8 8.6c-.2-.4-.4-.4-.6-.4H9Z"/></svg>נדבר בוואטסאפ</span></div>
  </div>
</div>
</body>
</html>
